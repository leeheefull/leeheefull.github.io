  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --card: #f6f8fa;
      --card-hover: #eaeef2;
      --border: #d0d7de;
      --accent: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --card: #161b22;
        --card-hover: #1f2630;
        --border: #30363d;
        --accent: #58a6ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 64px 24px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 4px;
    }
    .subtitle {
      color: var(--muted);
      margin: 0 0 40px;
      font-size: 0.95rem;
    }
    .pages {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .pages a {
      display: block;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
    }
    .pages a:hover {
      background: var(--card-hover);
    }
    .name {
      font-weight: 600;
      color: var(--accent);
    }
    .desc {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 2px;
    }
    .empty {
      color: var(--muted);
      font-size: 0.9rem;
      padding: 16px 20px;
      border: 1px dashed var(--border);
      border-radius: 10px;
    }
    .back {
      display: inline-block;
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.9rem;
      text-decoration: none;
    }
    .back:hover { color: var(--accent); }
  </style>
</head>
