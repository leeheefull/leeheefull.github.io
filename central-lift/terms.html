<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>약관 · 중앙리프트</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site"></header>

  <div class="sub-banner"><h1 id="pageTitle">약관</h1><p>TERMS</p></div>

  <main class="page">
    <div class="container">
      <div class="terms-body" id="body"><p class="board-status">불러오는 중...</p></div>
    </div>
  </main>

  <footer class="site"></footer>
  <script src="js/app.js"></script>
  <script>
    (async () => {
      const id = qs("id") || "privacy";
      const el = document.getElementById("body");
      try {
        const pages = await readTable("page");
        const p = pages.find((r) => r.page_id === id);
        document.getElementById("pageTitle").textContent = p ? p.title : "약관";
        document.title = (p ? p.title : "약관") + " · 중앙리프트";
        el.textContent = p ? p.content : "내용이 없습니다.";
      } catch {
        el.textContent = "내용을 불러오지 못했습니다.";
      }
    })();
  </script>
</body>
</html>
