<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회사소개 · 중앙리프트</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site"></header>

  <div class="sub-banner"><h1>회사소개</h1><p>COMPANY</p></div>

  <main class="page">
    <div class="container company-intro">
      <img class="banner" src="img/Int_Ban_1.png" alt="">
      <div class="text" id="introBody"><p class="board-status">불러오는 중...</p></div>
    </div>
  </main>

  <footer class="site"></footer>
  <script src="js/app.js"></script>
  <script>
    (async () => {
      const el = document.getElementById("introBody");
      try {
        const pages = await readTable("page");
        const p = pages.find((r) => r.page_id === "company_intro");
        el.innerHTML = "";
        const div = document.createElement("div");
        div.textContent = p ? p.content : "준비 중입니다.";
        el.append(div);
      } catch {
        el.textContent = "내용을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.";
      }
    })();
  </script>
</body>
</html>
