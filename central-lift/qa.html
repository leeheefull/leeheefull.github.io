<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>견적문의 · 중앙리프트</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site"></header>

  <div class="sub-banner"></div>

  <main class="page">
    <div class="container">
      <p class="total-line" id="totalLine"></p>
      <p class="board-status" id="status">불러오는 중...</p>
      <table class="post-table" id="table" hidden>
        <thead><tr><th style="width:120px">성명</th><th>제목</th><th style="width:120px">날짜</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="board-foot">
        <button class="btn accent" id="writeBtn">글쓰기</button>
      </div>

      <form class="form-card" id="qaForm" hidden>
        <h2>견적 문의하기</h2>
        <div class="row">
          <label>성함<input name="name" required maxlength="20"></label>
          <label>연락처<input name="phone" required maxlength="20" placeholder="010-0000-0000"></label>
        </div>
        <div class="row">
          <label>이메일 (선택)<input name="email" type="email" maxlength="50"></label>
          <label>제목<input name="subject" required maxlength="100" placeholder="예) 1t 카고 리프트게이트 견적 요청"></label>
        </div>
        <label>내용<textarea name="content" rows="5" required maxlength="2000"
          placeholder="차종과 원하시는 제품(수직형/자동형/슬라이딩/특수형)을 알려주세요."></textarea></label>
        <label class="check"><input type="checkbox" name="secret" checked>비밀글로 문의하기</label>
        <button class="btn accent" type="submit" id="qaSubmit">문의하기</button>
        <p class="form-status" id="qaStatus"></p>
      </form>
    </div>
  </main>

  <footer class="site"></footer>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderSubBanner("ESTIMATE", "견적문의");
    });

    document.getElementById("writeBtn").addEventListener("click", () => {
      const f = document.getElementById("qaForm");
      f.hidden = !f.hidden;
      if (!f.hidden) f.scrollIntoView({ behavior: "smooth" });
    });

    (async () => {
      let rows;
      try {
        rows = await readTable("qa");
      } catch {
        document.getElementById("status").textContent = "목록을 불러오지 못했습니다.";
        return;
      }
      rows.sort((a, b) => Number(b.wr_id) - Number(a.wr_id));
      document.getElementById("totalLine").innerHTML = `Total <b>${rows.length}건</b> 1 페이지`;
      document.getElementById("status").textContent = rows.length ? "" : "등록된 문의가 없습니다.";
      if (rows.length) document.getElementById("table").hidden = false;
      document.getElementById("tbody").innerHTML = rows.map((r) => {
        const secret = String(r.secret).toUpperCase() === "TRUE";
        return `<tr>
          <td>${esc(maskName(r.name))}</td>
          <td class="subject">${secret ? '<span class="lock">🔒</span> ' : ""}${esc(r.subject)}</td>
          <td>${esc((r.created_at || "").split(" ")[0])}</td>
        </tr>`;
      }).join("");
    })();

    document.getElementById("qaForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = e.target;
      const btn = document.getElementById("qaSubmit");
      const st = document.getElementById("qaStatus");
      btn.disabled = true;
      st.textContent = "접수 중...";
      try {
        await submitForm({
          action: "qa",
          name: f.name.value.trim(),
          phone: f.phone.value.trim(),
          email: f.email.value.trim(),
          subject: f.subject.value.trim(),
          content: f.content.value.trim(),
          secret: f.secret.checked,
        });
        st.textContent = "문의가 접수되었습니다. 빠르게 연락드리겠습니다!";
        f.reset();
        setTimeout(() => location.reload(), 1800);
      } catch {
        st.textContent = "접수에 실패했습니다. 전화(031-998-6588)로 문의해주세요.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
