<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffd9e4">
  <link rel="apple-touch-icon" href="/yuju/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="알바">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>알바 · 희찬 ❤️ 유주</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="page-alba">
  <canvas id="hearts"></canvas>

  <main class="alba">
    <header class="notes-header">
      <a class="back" href="../" aria-label="홈으로">←</a>
      <h1>알바</h1>
    </header>

    <section>
      <p class="alba-status" id="albaStatus">불러오는 중...</p>

      <div class="alba-card" id="albaCard" hidden>
        <span class="alba-label" id="albaLabel"></span>
        <span class="alba-big" id="albaBig"></span>
        <span class="alba-span" id="albaSpan"></span>
      </div>

      <div class="alba-prog" id="albaProg" hidden>
        <span class="alba-count" id="albaCount"></span>
        <div class="alba-bar"><i id="albaBarFill"></i></div>
      </div>

      <ul class="alba-list" id="albaList" hidden></ul>

      <p class="alba-note" id="albaNote" hidden></p>
    </section>
  </main>

  <script src="../main.js"></script>
  <script src="alba.js"></script>
</body>
</html>
