<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffd9e4">
  <link rel="icon" href="/yuju/icon.svg">
  <link rel="apple-touch-icon" href="/yuju/icon-180.png">
  <link rel="manifest" href="/yuju/site.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="단어장">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>스페인어 단어장 · 희찬 ❤️ 유주</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="page-voca">
  <main class="voca">
    <header class="notes-header">
      <h1>스페인어 단어장</h1>
    </header>

    <!-- 모드 선택 -->
    <section id="vocaMenu" class="voca-menu">
      <p class="voca-status" id="vocaStatus">단어를 불러오는 중...</p>
      <button class="voca-mode" id="modeAll" disabled>🎲 전체 단어 랜덤 풀기</button>
      <div class="voca-book-list" id="bookList"></div>
      <button class="voca-mode ghost" id="modeFail" disabled>💦 자주 틀린 문제 풀기</button>
    </section>

    <!-- 책 → unit 선택 -->
    <section id="vocaUnits" class="voca-units" hidden>
      <p class="voca-units-title" id="unitsTitle"></p>
      <button class="voca-mode book-random" id="bookRandomBtn"></button>
      <p class="voca-units-sub">풀고 싶은 unit을 골라줘!</p>
      <div class="unit-grid" id="unitGrid"></div>
      <button class="voca-mode ghost unit-back" id="unitsBackBtn">← 처음으로</button>
    </section>

    <!-- 퀴즈 -->
    <section id="vocaQuiz" class="voca-quiz" hidden>
      <p class="voca-progress" id="quizProgress"><span class="voca-scope" id="quizScope"></span><span id="quizNo"></span></p>
      <div class="voca-card">
        <span class="voca-fail-badge" id="failBadge" hidden></span>
        <p class="voca-word" id="quizWord"></p>
        <p class="voca-hint" id="quizHint" hidden></p>
        <button class="voca-hint-btn" id="hintBtn">힌트 보기</button>
      </div>
      <div class="voca-options" id="quizOptions"></div>
      <p class="voca-feedback" id="quizFeedback"></p>
      <button class="voca-next hold" id="nextBtn">다음 문제</button>
      <button class="voca-mode ghost unit-back" id="quizBackBtn">← 처음으로</button>
    </section>

    <!-- 결과 -->
    <section id="vocaResult" class="voca-result" hidden>
      <p class="voca-score" id="resultScore"></p>
      <ul class="voca-wrong-list" id="resultWrong"></ul>
      <button class="voca-mode" id="retryBtn">다시 풀기</button>
      <button class="voca-mode ghost" id="backToMenuBtn">처음으로</button>
    </section>
  </main>

  <nav class="tabbar" aria-label="주요 메뉴">
    <a href="../">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg></span>
      <span>홈</span>
    </a>
    <a href="../notes/">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg><i class="dot" id="notesDot" hidden></i></span>
      <span>글</span>
    </a>
    <a href="../todo/">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg></span>
      <span>위시</span>
    </a>
    <a href="../spain-voca/" aria-current="page">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h7v15H4zM13 5h7v15h-7z"/></svg></span>
      <span>단어</span>
    </a>
  </nav>

  <script src="../main.js"></script>
  <script src="voca.js"></script>
</body>
</html>
