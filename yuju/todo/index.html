<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffd9e4">
  <link rel="icon" href="/yuju/icon.svg">
  <link rel="apple-touch-icon" href="/yuju/icon-180.png">
  <link rel="manifest" href="/yuju/site.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="하고싶은것">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>하고 싶은 것 · 희찬 ❤️ 유주</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="page-todo">
  <main class="todo">
    <header class="notes-header">
      <h1>하고 싶은 것</h1>
    </header>

    <!-- 하고 싶은 것 -->
    <section id="todoMain">
      <p class="todo-status" id="todoStatus">불러오는 중...</p>
      <ul class="todo-list" id="todoList"></ul>

      <button type="button" class="todo-memory" id="memoryBtn" hidden>
        <span class="memory-head">우리가 한 것 <em id="doneCount"></em><span class="memory-go">›</span></span>
        <ul class="memory-peek" id="memoryPeek"></ul>
      </button>

      <form class="todo-add" id="todoForm">
        <div class="who" role="radiogroup" aria-label="추가한 사람">
          <label><input type="radio" name="who" value="희찬" checked><span>희찬</span></label>
          <label><input type="radio" name="who" value="유주"><span>유주</span></label>
        </div>
        <div class="todo-add-row">
          <input type="text" id="todoText" maxlength="100" placeholder="하고 싶은 거 적기" autocomplete="off">
          <button type="submit" id="todoSubmit" aria-label="추가">+</button>
        </div>
      </form>
    </section>

    <!-- 우리가 한 것 -->
    <section id="doneScreen" hidden>
      <p class="todo-done-title">우리가 한 것</p>
      <ul class="todo-list done-list" id="doneList"></ul>
      <button type="button" class="todo-back" id="doneBackBtn">← 하고 싶은 것으로</button>
    </section>
  </main>

  <nav class="tabbar" aria-label="주요 메뉴">
    <a href="../">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg></span>
      <span>홈</span>
    </a>
    <a href="../calendar/">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4"/></svg></span>
      <span>달력</span>
    </a>
    <a href="../notes/">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg><i class="dot" id="notesDot" hidden></i></span>
      <span>글</span>
    </a>
    <a href="../todo/" aria-current="page">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg></span>
      <span>위시</span>
    </a>
    <a href="../spain-voca/">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h7v15H4zM13 5h7v15h-7z"/></svg></span>
      <span>단어</span>
    </a>
  </nav>

  <script src="../store.js"></script>
  <script src="../main.js"></script>
  <script src="todo.js"></script>
</body>
</html>
