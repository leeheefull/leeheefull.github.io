<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffd9e4">
  <link rel="apple-touch-icon" href="/yuju/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="글남기기">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>글 남기기 · 희찬 ❤️ 유주</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="page-notes">
  <canvas id="hearts"></canvas>

  <main class="notes">
    <header class="notes-header">
      <a class="back" href="../" aria-label="홈으로">←</a>
      <h1>글 남기기</h1>
    </header>

    <form id="noteForm">
      <div class="who" role="radiogroup" aria-label="작성자">
        <label><input type="radio" name="who" value="희찬" checked><span>희찬</span></label>
        <label><input type="radio" name="who" value="유주"><span>유주</span></label>
      </div>
      <textarea id="noteText" rows="3" maxlength="500" placeholder="남기고 싶은 말을 적어주세요"></textarea>
      <button type="submit" id="noteSubmit">남기기</button>
    </form>

    <p class="notes-status" id="notesStatus"></p>
    <ul class="note-list" id="noteList"></ul>
  </main>

  <script src="../main.js"></script>
  <script src="notes.js"></script>
</body>
</html>
