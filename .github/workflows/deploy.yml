name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Build portfolio (Astro)
        working-directory: portfolio
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          rsync -a yuju/ _site/yuju/
          rsync -a portfolio/dist/ _site/portfolio/
          rsync -a central-lift/ _site/central-lift/
          rsync -a pages/ _site/pages/
          cp favicon.svg site.webmanifest icon-192.png icon-512.png apple-touch-icon.png _site/

      - name: Encrypt index page
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "SITE_PASSWORD secret is not set" >&2
            exit 1
          fi
          npx -y staticrypt index.html -p "$SITE_PASSWORD" -d _site \
            --short --remember 30 \
            --template .github/staticrypt-template.html \
            --template-title "ACCESS TERMINAL" \
            --template-remember "keep access token (30 days)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
